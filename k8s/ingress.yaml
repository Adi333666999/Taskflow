apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: taskflow.local
      http:
        paths: 
          - path: /
            pathType: Prefix
            backend: 
              service:
                name: taskflow-service
                port: 
                  number: 80

